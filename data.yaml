path: ./coco_corner_dataset  # Root dataset directory
train: train/images              # Point to images, not labels
val: val/images                  # Point to images, not labels

nc: 1                           # Number of classes (required)
names:
  0: card

kpt_shape: [4, 3]               # 4 keypoints, each with x, y, visibility
                                # MUST be 3 values per keypoint for YOLOv8 pose

flip_idx: []                    # No symmetric keypoints for card corners

# Optional but recommended - keypoint names for visualization
keynames:
  0: top_left
  1: top_right  
  2: bottom_right
  3: bottom_left